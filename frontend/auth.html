<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication — StockPulse.ai</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-page-body" data-page="auth">

  <div class="auth-wrapper">
    <div class="auth-brand">
      <i data-lucide="trending-up" class="logo-icon-lg"></i>
      <h2>StockPulse<span>.ai</span></h2>
      <p>Sign in to predict, train, or manage models</p>
    </div>

    <div class="card auth-card">
      <div class="modal-tabs">
        <button class="auth-tab-btn active" id="tabBtnLogin">Login</button>
        <button class="auth-tab-btn" id="tabBtnRegister">Register</button>
      </div>

      <form id="loginForm" class="auth-form active-form">
        <div class="input-group">
          <label for="loginUsername">Email / Username</label>
          <input type="text" id="loginUsername" placeholder="Enter username or email" required>
        </div>
        <div class="input-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Login</button>
      </form>

      <form id="registerForm" class="auth-form">
        <div class="input-group">
          <label for="regUsername">Username</label>
          <input type="text" id="regUsername" placeholder="Choose a username" required>
        </div>
        <div class="input-group">
          <label for="regEmail">Email</label>
          <input type="email" id="regEmail" placeholder="name@company.com" required>
        </div>
        <div class="input-group">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" placeholder="••••••••" required minlength="6">
        </div>
        <div class="input-group">
          <label for="regConfirmPassword">Confirm Password</label>
          <input type="password" id="regConfirmPassword" placeholder="••••••••" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary btn-full">Register</button>
      </form>

      <div class="auth-footer">
        <a href="index.html" class="back-link"><i data-lucide="arrow-left"></i> Back to Dashboard</a>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
